<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote — WTC Labour Rates</title>
<style>
  :root { --pink: #ec3b73; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; max-width: 720px; margin: 40px auto; padding: 0 20px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #1a1a1a; padding-bottom: 14px; margin-bottom: 20px; }
  .brand { font-weight: 800; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 0.02em; }
  .brand .plus, .brand .co { color: var(--pink); }
  h1 { font-size: 1.1rem; margin: 0 0 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-bottom: 18px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; }
  th { color: #555; font-size: 0.75rem; text-transform: uppercase; }
  td.num, th.num { text-align: right; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; margin-bottom: 20px; font-size: 0.9rem; }
  .meta-grid .k { color: #666; }
  .totals { display: flex; gap: 28px; margin: 18px 0; }
  .totals .box { }
  .totals .box .label { font-size: 0.75rem; color: #666; display: block; }
  .totals .box .value { font-size: 1.3rem; font-weight: 800; }
  .charge { color: var(--pink); }
  .ot-badge { display: inline-block; font-size: 0.65rem; font-weight: 800; color: #b8860b; border: 1px solid #b8860b; border-radius: 100px; padding: 1px 6px; vertical-align: middle; }
  footer { margin-top: 30px; font-size: 0.75rem; color: #777; border-top: 1px solid #ddd; padding-top: 10px; }
  .no-print { margin-bottom: 20px; }
  @media print { .no-print { display: none; } }
</style>
</head>
<body>
  <div class="no-print"><button onclick="window.print()">Print / Save as PDF</button></div>
  <header>
    <div class="brand">WORK<span class="plus">+</span>TRAVEL <span class="co">CO.</span></div>
    <div style="text-align:right">
      <div id="dateOut" class="small"></div>
    </div>
  </header>
  <h1>Indicative labour hire rate</h1>
  <div id="content">Loading…</div>
  <footer id="footerText"></footer>

<script>
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  // ?t=<token> is the client's sign-off link: no login, client-safe data only, with the accept form.
  const token = params.get("t");
  // Default is the client-facing quote: our charge rates only. ?internal=1 shows
  // the full build-up (award rates, on-costs, margin) for staff -- never send that one.
  const internal = !token && params.get("internal") === "1";
  const money = (n) => `$${Number(n).toFixed(2)}`;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  document.getElementById("footerText").textContent = internal
    ? "INTERNAL COPY — contains award rates, on-costs and margin. Do not send to the client. Indicative build-up only, calculated from the Fair Work Modern Award rates in force at the time of calculation; the award is the controlling legal instrument."
    : "Rates are indicative, based on current award conditions, and exclusive of GST. Final charges are based on hours actually worked and the award conditions that apply to those hours.";

  fetch(token ? `/api/client-quote/${encodeURIComponent(token)}` : `/api/staff/quotes/${id}`).then(async (res) => {
    if (res.status === 401 && !token) { location.href = "/login.html"; return; }
    if (!res.ok) {
      const msg = token ? (await res.json().catch(() => ({}))).error : "";
      document.getElementById("content").textContent = msg || "Quote not found.";
      return;
    }
    const q = await res.json();
    const dateStr = new Date(q.created_at + "Z").toISOString().slice(0, 10);
    document.title = `WTC Quote - ${q.client_name} - ${dateStr} - ${q.id}`;
    document.getElementById("dateOut").textContent = new Date(q.created_at + "Z").toLocaleString();
    if (internal) document.title += " (INTERNAL)";
    const rateTh = internal ? '<th class="num">Award rate</th>' : "";
    const rateTd = (v) => (internal ? `<td class="num">${money(v)}</td>` : "");
    const casualSource =
      q.casual_rate_source === "shift_calculator"
        ? "shift calculator (award rules applied to the proposed shifts)"
        : q.casual_rate_source === "award_table"
        ? "award's own official casual pay table"
        : q.casual_rate_source === "loading_fallback"
        ? `permanent rates + ${q.casual_loading_pct}% fallback loading`
        : "n/a";
    // New quotes store shifts.staff = [{name,count,shifts}]; older ones a single shifts.shifts list.
    const rosterGroups = !q.shifts
      ? []
      : Array.isArray(q.shifts.staff)
      ? q.shifts.staff.filter((g) => g.shifts && g.shifts.length)
      : q.shifts.shifts && q.shifts.shifts.length
      ? [{ name: null, count: 1, shifts: q.shifts.shifts }]
      : [];
    // Terms the staff member entered: shown on both the client and the internal copy.
    const termParts = [];
    if (q.min_engagement_hours != null) termParts.push(q.min_engagement_hours > 0 ? `Minimum engagement: ${q.min_engagement_hours} hours per shift` : "No minimum engagement");
    if (q.daily_ot_hours != null) termParts.push(`Overtime applies after ${q.daily_ot_hours} ordinary hours in a day`);
    const termsHtml = termParts.length
      ? `<p style="font-size:0.88rem;margin:0 0 10px"><strong>Terms:</strong> ${termParts.join(". ")}.</p>`
      : "";
    // Sign-off block: the accepted record (staff and client copies), or the accept form on the client's link.
    const acceptedHtml = () =>
      `<div style="border:2px solid #1f7a3d;background:#eef8f1;padding:10px 12px;margin:14px 0;font-size:0.9rem"><strong>Accepted</strong> by ${esc(q.accepted_name)} on ${new Date(q.accepted_at).toLocaleString()}.</div>`;
    const acceptHtml = q.accepted_at
      ? acceptedHtml()
      : token
      ? `<div class="no-print" style="border:2px solid #1a1a1a;padding:12px 14px;margin:14px 0">
           <strong>Accept this quote</strong>
           <p style="font-size:0.85rem;margin:6px 0">By accepting you confirm these rates, hours and terms for ${esc(q.client_name)}. Rates are exclusive of GST.</p>
           <label style="display:block;font-size:0.85rem;margin:8px 0 2px">Your full name</label>
           <input id="accName" maxlength="100" style="width:100%;max-width:320px;padding:6px">
           <label style="display:block;font-size:0.85rem;margin:8px 0"><input type="checkbox" id="accAgree"> I'm authorised to accept this quote on behalf of ${esc(q.client_name)}</label>
           <button id="accBtn" style="padding:8px 16px;font-weight:700">Accept quote</button>
           <div id="accMsg" style="color:#b00020;font-size:0.85rem;margin-top:6px"></div>
         </div>`
      : "";
    const total =
      q.roster.reduce((s, l) => s + l.chargeLineTotal, 0) + (q.allowances || []).reduce((s, l) => s + l.chargeLineTotal, 0);
    document.getElementById("content").innerHTML = `
      ${internal ? '<p style="background:#fff3cd;border:1px solid #e0b400;padding:8px 10px;font-weight:700">INTERNAL COPY — shows award rates, on-costs and margin. Do not send to the client.</p>' : ""}
      <div class="meta-grid">
        <div><span class="k">Employer / client:</span> ${q.client_name}</div>
        <div><span class="k">Role:</span> ${q.role_title || "—"}</div>
        <div><span class="k">Classification:</span> ${q.classification_name}</div>
        <div><span class="k">Engagement:</span> ${q.is_casual ? "Casual" : "Permanent"}</div>
        <div><span class="k">Prepared by:</span> ${q.staff_name}</div>
        ${internal ? `<div><span class="k">Award:</span> ${q.award_name} (${q.award_code})</div><div><span class="k">Casual rate source:</span> ${casualSource}</div>` : ""}
      </div>
      ${
        rosterGroups.length
          ? `<p class="small" style="margin:0 0 4px"><strong>Proposed roster${rosterGroups.length > 1 || rosterGroups[0].count > 1 ? "s" : ""}</strong>${q.shifts.publicHolidays && q.shifts.publicHolidays.length ? ` — public holiday: ${q.shifts.publicHolidays.map((d) => ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][d]).join(", ")}` : ""}</p>
             ${rosterGroups
               .map(
                 (g) => `${g.name ? `<p style="margin:10px 0 4px;font-size:0.88rem"><strong>${esc(g.name)}</strong>${g.count > 1 ? ` — ${g.count} staff on this roster (hours shown are per person)` : ""}</p>` : ""}
             <table>
               <thead><tr><th>Shift</th><th class="num">Paid hours</th>${internal ? "<th>Split under the award</th>" : ""}</tr></thead>
               <tbody>${g.shifts
                 .map(
                   (d) => `<tr><td>${d.dayName} ${d.start} – ${d.finish}${d.breakMins ? ` <span style="color:#777">(${d.breakMins} min unpaid break)</span>` : ""}</td><td class="num">${d.workedHours}</td>${
                     internal ? `<td style="font-size:0.8rem">${d.segments.map((s) => `${s.hours}h ${esc(s.label)}${s.isOvertime ? " (OT)" : ""}`).join(" · ")}</td>` : ""
                   }</tr>`
                 )
                 .join("")}</tbody>
             </table>`
               )
               .join("")}
             ${rosterGroups.length > 1 || rosterGroups[0].count > 1 ? `<p style="font-size:0.8rem;color:#666;margin:0 0 12px">The pay-category hours below are the totals across all staff.</p>` : ""}
             ${
               internal && q.shifts.warnings && q.shifts.warnings.length
                 ? `<div style="background:#fff3cd;border:1px solid #e0b400;padding:8px 10px;font-size:0.8rem;margin-bottom:12px"><strong>Calculator warnings:</strong><ul style="margin:4px 0 0 16px;padding:0">${q.shifts.warnings.map((w) => `<li>${w}</li>`).join("")}</ul></div>`
                 : ""
             }
             ${
               internal && q.shifts.overrides && q.shifts.overrides.length
                 ? `<p style="font-size:0.8rem;color:#8a5a00"><strong>Hours manually adjusted:</strong> ${q.shifts.overrides.map((o) => `${o.label} ${o.from}h → ${o.to}h`).join("; ")}</p>`
                 : ""
             }
             ${
               internal && q.shifts.assumptions && q.shifts.assumptions.length
                 ? `<details style="font-size:0.75rem;color:#555;margin-bottom:12px"><summary>Assumptions used</summary><ul style="margin:4px 0 0 16px;padding:0">${q.shifts.assumptions.map((a) => `<li>${a}</li>`).join("")}</ul></details>`
                 : ""
             }`
          : ""
      }
      <table>
        <thead><tr><th>Pay category</th><th class="num">Hours</th>${rateTh}<th class="num">Charge rate (excl. GST)</th><th class="num">Charge total</th></tr></thead>
        <tbody>
          ${q.roster.map((l) => `<tr><td>${l.penaltyDescription}${l.isOvertime ? ' <span class="ot-badge">OT</span>' : ""}</td><td class="num">${l.hours}</td>${rateTd(l.loadedRate)}<td class="num">${money(l.chargeRate)}</td><td class="num">${money(l.chargeLineTotal)}</td></tr>`).join("")}
        </tbody>
      </table>
      ${
        q.allowances && q.allowances.length
          ? `<table>
              <thead><tr><th>Allowance</th><th class="num">Qty</th>${rateTh}<th class="num">Charge rate (excl. GST)</th><th class="num">Charge total</th></tr></thead>
              <tbody>${q.allowances.map((l) => `<tr><td>${l.allowance}</td><td class="num">${l.quantity}</td>${rateTd(l.amount)}<td class="num">${money(l.chargeRate)}</td><td class="num">${money(l.chargeLineTotal)}</td></tr>`).join("")}</tbody>
            </table>`
          : ""
      }
      <div class="totals">
        <div class="box"><span class="label">Total charge (excl. GST) for this roster</span><span class="value charge">${money(total)}</span></div>
      </div>
      ${
        internal
          ? `<p class="small" style="color:#666">Weighted average (reference only): award ${money(q.blended_award_rate)}/hr → cost ${money(q.cost_rate)}/hr (+${q.oncost_pct}% on-costs) → charge ${money(q.charge_rate)}/hr (+${q.margin_pct}% margin)</p>`
          : ""
      }
      ${termsHtml}
      <p class="small" style="color:#666">All rates are exclusive of GST. GST is charged in addition on invoicing.</p>
      <div id="acceptBox">${acceptHtml}</div>
      ${internal && q.notes ? `<p><strong>Internal notes:</strong> ${q.notes}</p>` : ""}
    `;
    const btn = document.getElementById("accBtn");
    if (btn) {
      btn.addEventListener("click", async () => {
        const msg = document.getElementById("accMsg");
        msg.textContent = "";
        btn.disabled = true;
        const r = await fetch(`/api/client-quote/${encodeURIComponent(token)}/accept`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: document.getElementById("accName").value, agree: document.getElementById("accAgree").checked }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok) {
          q.accepted_at = d.accepted_at;
          q.accepted_name = d.accepted_name;
          document.getElementById("acceptBox").innerHTML = acceptedHtml();
        } else {
          msg.textContent = d.error || "Something went wrong - please try again.";
          btn.disabled = false;
        }
      });
    }
  });
</script>
</body>
</html>
