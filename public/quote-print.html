<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote — WTC Labour Rates</title>
<style>
  :root { --pink: #ec3b73; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; max-width: 720px; margin: 40px auto; padding: 0 20px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #1a1a1a; padding-bottom: 14px; margin-bottom: 20px; }
  .brand { font-weight: 800; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 0.02em; }
  .brand .plus, .brand .co { color: var(--pink); }
  h1 { font-size: 1.1rem; margin: 0 0 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-bottom: 18px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; }
  th { color: #555; font-size: 0.75rem; text-transform: uppercase; }
  td.num, th.num { text-align: right; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; margin-bottom: 20px; font-size: 0.9rem; }
  .meta-grid .k { color: #666; }
  .totals { display: flex; gap: 28px; margin: 18px 0; }
  .totals .box { }
  .totals .box .label { font-size: 0.75rem; color: #666; display: block; }
  .totals .box .value { font-size: 1.3rem; font-weight: 800; }
  .charge { color: var(--pink); }
  .ot-badge { display: inline-block; font-size: 0.65rem; font-weight: 800; color: #b8860b; border: 1px solid #b8860b; border-radius: 100px; padding: 1px 6px; vertical-align: middle; }
  footer { margin-top: 30px; font-size: 0.75rem; color: #777; border-top: 1px solid #ddd; padding-top: 10px; }
  .no-print { margin-bottom: 20px; }
  @media print { .no-print { display: none; } }
</style>
</head>
<body>
  <div class="no-print"><button onclick="window.print()">Print / Save as PDF</button></div>
  <header>
    <div class="brand">WORK<span class="plus">+</span>TRAVEL <span class="co">CO.</span></div>
    <div style="text-align:right">
      <div id="dateOut" class="small"></div>
    </div>
  </header>
  <h1>Indicative labour hire rate</h1>
  <div id="content">Loading…</div>
  <footer id="footerText"></footer>

<script>
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  // Default is the client-facing quote: our charge rates only. ?internal=1 shows
  // the full build-up (award rates, on-costs, margin) for staff -- never send that one.
  const internal = params.get("internal") === "1";
  const money = (n) => `$${Number(n).toFixed(2)}`;
  document.getElementById("footerText").textContent = internal
    ? "INTERNAL COPY — contains award rates, on-costs and margin. Do not send to the client. Indicative build-up only, calculated from the Fair Work Modern Award rates in force at the time of calculation; the award is the controlling legal instrument."
    : "Rates are indicative, based on current award conditions, and exclusive of GST. Final charges are based on hours actually worked and the award conditions that apply to those hours.";

  fetch(`/api/staff/quotes/${id}`).then(async (res) => {
    if (res.status === 401) { location.href = "/login.html"; return; }
    if (!res.ok) { document.getElementById("content").textContent = "Quote not found."; return; }
    const q = await res.json();
    const dateStr = new Date(q.created_at + "Z").toISOString().slice(0, 10);
    document.title = `WTC Quote - ${q.client_name} - ${dateStr} - ${q.id}`;
    document.getElementById("dateOut").textContent = new Date(q.created_at + "Z").toLocaleString();
    if (internal) document.title += " (INTERNAL)";
    const rateTh = internal ? '<th class="num">Award rate</th>' : "";
    const rateTd = (v) => (internal ? `<td class="num">${money(v)}</td>` : "");
    const casualSource =
      q.casual_rate_source === "award_table"
        ? "award's own official casual pay table"
        : q.casual_rate_source === "loading_fallback"
        ? `permanent rates + ${q.casual_loading_pct}% fallback loading`
        : "n/a";
    const total =
      q.roster.reduce((s, l) => s + l.chargeLineTotal, 0) + (q.allowances || []).reduce((s, l) => s + l.chargeLineTotal, 0);
    document.getElementById("content").innerHTML = `
      ${internal ? '<p style="background:#fff3cd;border:1px solid #e0b400;padding:8px 10px;font-weight:700">INTERNAL COPY — shows award rates, on-costs and margin. Do not send to the client.</p>' : ""}
      <div class="meta-grid">
        <div><span class="k">Employer / client:</span> ${q.client_name}</div>
        <div><span class="k">Role:</span> ${q.role_title || "—"}</div>
        <div><span class="k">Classification:</span> ${q.classification_name}</div>
        <div><span class="k">Engagement:</span> ${q.is_casual ? "Casual" : "Permanent"}</div>
        <div><span class="k">Prepared by:</span> ${q.staff_name}</div>
        ${internal ? `<div><span class="k">Award:</span> ${q.award_name} (${q.award_code})</div><div><span class="k">Casual rate source:</span> ${casualSource}</div>` : ""}
      </div>
      <table>
        <thead><tr><th>Pay category</th><th class="num">Hours</th>${rateTh}<th class="num">Charge rate (excl. GST)</th><th class="num">Charge total</th></tr></thead>
        <tbody>
          ${q.roster.map((l) => `<tr><td>${l.penaltyDescription}${l.isOvertime ? ' <span class="ot-badge">OT</span>' : ""}</td><td class="num">${l.hours}</td>${rateTd(l.loadedRate)}<td class="num">${money(l.chargeRate)}</td><td class="num">${money(l.chargeLineTotal)}</td></tr>`).join("")}
        </tbody>
      </table>
      ${
        q.allowances && q.allowances.length
          ? `<table>
              <thead><tr><th>Allowance</th><th class="num">Qty</th>${rateTh}<th class="num">Charge rate (excl. GST)</th><th class="num">Charge total</th></tr></thead>
              <tbody>${q.allowances.map((l) => `<tr><td>${l.allowance}</td><td class="num">${l.quantity}</td>${rateTd(l.amount)}<td class="num">${money(l.chargeRate)}</td><td class="num">${money(l.chargeLineTotal)}</td></tr>`).join("")}</tbody>
            </table>`
          : ""
      }
      <div class="totals">
        <div class="box"><span class="label">Total charge (excl. GST) for this roster</span><span class="value charge">${money(total)}</span></div>
      </div>
      ${
        internal
          ? `<p class="small" style="color:#666">Weighted average (reference only): award ${money(q.blended_award_rate)}/hr → cost ${money(q.cost_rate)}/hr (+${q.oncost_pct}% on-costs) → charge ${money(q.charge_rate)}/hr (+${q.margin_pct}% margin)</p>`
          : ""
      }
      <p class="small" style="color:#666">All rates are exclusive of GST. GST is charged in addition on invoicing.</p>
      ${internal && q.notes ? `<p><strong>Internal notes:</strong> ${q.notes}</p>` : ""}
    `;
  });
</script>
</body>
</html>
